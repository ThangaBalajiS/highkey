<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Highkey Popup</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        body { 
            width: 360px; 
            min-height: 480px; 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            background: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }
        
        /* HEADER */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .logo { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: 700; 
            font-size: 15px; 
            letter-spacing: -0.01em;
        }
        .logo svg { color: var(--accent); }
        .version {
            font-size: 11px;
            color: var(--muted);
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        /* MAIN CONTENT */
        .content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        /* HERO ACTION */
        .hero-action { 
            background: var(--accent); 
            border: none; 
            border-radius: var(--radius-md); 
            padding: 16px; 
            text-align: center; 
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s, filter 0.2s;
            color: white;
            box-shadow: 0 4px 12px oklch(60% 0.15 250 / 0.2);
            position: relative;
            overflow: hidden;
        }
        .hero-action:hover { 
            filter: brightness(1.05);
            box-shadow: 0 6px 16px oklch(60% 0.15 250 / 0.3);
            transform: translateY(-1px);
        }
        .hero-action:active {
            transform: translateY(1px);
            box-shadow: 0 2px 4px oklch(60% 0.15 250 / 0.2);
        }
        .hero-action strong { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
        }
        .hero-action span { 
            display: block; 
            font-size: 13px; 
            opacity: 0.9; 
            margin-top: 6px; 
            font-weight: 400;
        }

        /* SECTION */
        .section-title { 
            font-size: 12px; 
            font-weight: 600;
            text-transform: uppercase; 
            color: var(--muted); 
            letter-spacing: 0.05em; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        
        .empty-state {
            text-align: center;
            padding: 32px 0;
            color: var(--muted);
            font-size: 13px;
        }
        .empty-state svg {
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* SHORTCUTS LIST */
        .shortcuts-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .shortcut-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            transition: border-color 0.2s;
        }
        .shortcut-item:hover {
            border-color: var(--muted);
        }
        
        .shortcut-info { flex: 1; overflow: hidden; }
        .shortcut-name { 
            font-size: 13px; 
            font-weight: 600; 
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .shortcut-keys { 
            font-size: 11px; 
            color: var(--muted); 
            font-family: var(--font-mono); 
            display: inline-flex;
            gap: 4px;
        }
        .key-badge {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        .shortcut-actions { 
            display: flex; 
            gap: 4px; 
            opacity: 0;
            transition: opacity 0.2s;
        }
        .shortcut-item:hover .shortcut-actions {
            opacity: 1;
        }
        .action-btn { 
            background: var(--bg); 
            border: 1px solid var(--border); 
            color: var(--muted); 
            cursor: pointer; 
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }
        .action-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-4px);
            background: var(--fg);
            color: var(--bg);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            pointer-events: none;
            z-index: 10;
        }
        .action-btn::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            border-width: 4px;
            border-style: solid;
            border-color: var(--fg) transparent transparent transparent;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            pointer-events: none;
            z-index: 10;
        }
        .action-btn:hover::after,
        .action-btn:hover::before {
            opacity: 1;
            visibility: visible;
        }
        .action-btn:hover::after {
            transform: translateX(-50%) translateY(-8px);
        }
        .action-btn:hover::before {
            transform: translateX(-50%) translateY(-4px);
        }
        .action-btn:hover { 
            background: var(--surface); 
            color: var(--accent); 
            border-color: var(--accent);
        }
        .action-btn.del:hover { 
            color: var(--danger); 
            border-color: var(--danger);
            background: oklch(95% 0.05 25);
        }
        
        /* FOOTER */
        .footer { 
            padding: 16px 20px; 
            border-top: 1px solid var(--border); 
            background: var(--surface);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .footer a { 
            font-size: 13px; 
            color: var(--accent); 
            text-decoration: none; 
            font-weight: 600; 
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        .footer a:hover {
            opacity: 0.8;
        }
        .footer-icon-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            transition: all 0.2s;
        }
        .footer-icon-btn:hover {
            background: var(--bg);
            color: var(--fg);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"></path><path d="M6 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"></path></svg>
            Highkey
        </div>
        <div class="version mono">v1.0.0</div>
    </div>

    <div class="content">
        <div class="hero-action" id="start-binding">
            <strong>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M9 21H3v-6"></path><path d="M21 3l-7 7"></path><path d="M3 21l7-7"></path></svg>
                Pick Element
            </strong>
            <span>Select any UI element in the page</span>
        </div>

        <div id="current-site-section">
            <div class="section-title">
                <span>Active on this page</span>
                <span class="mono" id="shortcut-count" style="font-size: 11px; padding: 2px 6px; background: var(--surface); border-radius: 10px; border: 1px solid var(--border);">0</span>
            </div>

            <div class="shortcuts-list" id="shortcut-list">
                <!-- Shortcuts will be populated here -->
            </div>
            
            <div id="empty-state" class="empty-state" style="display: none;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <div>No shortcuts bound on this site yet.</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="#" id="open-dashboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Manage shortcuts
        </a>
        <div style="display: flex; gap: 8px;">
            <button class="footer-icon-btn" title="Settings" id="open-settings">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>
    </div>

    <script type="module" src="./main.ts"></script>
</body>
</html>
