<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Highkey Popup</title>
    <style>
        body { width: 360px; min-height: 400px; padding: 16px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
        .logo svg { color: var(--accent); }
        
        .hero-action { 
            background: var(--surface); 
            border: 1px dashed var(--accent); 
            border-radius: var(--radius-md); 
            padding: 12px; 
            text-align: center; 
            margin-bottom: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .hero-action:hover { background: oklch(95% 0.01 255); }
        .hero-action span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }

        .section-title { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 12px; display: flex; justify-content: space-between; }
        
        .shortcut-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .shortcut-item:last-child { border-bottom: none; }
        .shortcut-info { flex: 1; }
        .shortcut-name { font-size: 13px; font-weight: 500; }
        .shortcut-keys { font-size: 11px; color: var(--muted); font-family: var(--font-mono); background: var(--surface); padding: 2px 4px; border-radius: 3px; }
        
        .shortcut-actions { display: flex; gap: 8px; }
        .action-btn { 
            background: none; 
            border: none; 
            color: var(--muted); 
            font-size: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            padding: 4px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .action-btn:hover { background: var(--surface); color: var(--accent); }
        .action-btn.del:hover { color: var(--danger); }
        
        .footer { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 12px; display: flex; justify-content: space-between; align-items: center; }
        .footer a { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 500; }
        
        .recording-overlay {
            position: fixed; inset: 0; background: var(--bg); display: none;
            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
            z-index: 100;
        }
        .recording-overlay.active { display: flex; }
        .key-prompt { font-size: 24px; font-weight: 700; margin: 16px 0; color: var(--accent); }
    </style>

</head>

    <div class="hero-action" id="start-binding">
        <strong>Pick Element</strong>
        <span>Select any UI element in the page</span>

    <div id="current-site-section" style="display: none;">
