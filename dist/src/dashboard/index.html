<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Highkey Dashboard</title>
    <style>
        body { display: flex; height: 100vh; overflow: hidden; background: var(--bg); }
        
        .sidebar { 
            width: 240px; 
            background: var(--surface); 
            border-right: 1px solid var(--border); 
            display: flex; 
            flex-direction: column;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .sidebar-brand { padding: 0 24px 32px; font-weight: 700; display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 18px; }
        .nav-item { 
            padding: 10px 24px; 
            font-size: 14px; 
            color: var(--muted); 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            border-left: 3px solid transparent;
        }
        .nav-item.active { color: var(--fg); background: oklch(96% 0.005 250); border-left-color: var(--accent); font-weight: 500; }
        .nav-item:hover:not(.active) { background: oklch(98% 0.002 250); }

        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { padding: 20px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--surface); }
        .content { flex: 1; padding: 40px; overflow-y: auto; }
        
        .table-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: oklch(98% 0.002 250); padding: 12px 20px; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: oklch(99.5% 0.001 250); }

        .selector-code { font-family: var(--font-mono); font-size: 11px; background: var(--bg); color: var(--muted); padding: 4px 6px; border-radius: 4px; border: 1px solid var(--border); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
        .shortcut-badge { font-family: var(--font-mono); font-weight: 600; background: var(--fg); color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; }

        .search-box { position: relative; }
        .search-box input { padding: 8px 12px 8px 32px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; width: 280px; outline: none; }
        .search-box input:focus { border-color: var(--accent); }
        .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            background: var(--bg);
            width: 420px;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .modal-header {
            font-size: 18px;
            font-weight: 600;
            color: var(--fg);
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .form-input {
            background: var(--surface);
            color: var(--fg);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
        }
        .form-input:focus {
            border-color: var(--accent);
            outline: none;
        }
        .form-input.mono { font-family: var(--font-mono); }
        .shortcut-capture {
            background: var(--surface);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            border: 1px dashed var(--border);
            font-weight: 600;
            transition: all 0.2s;
            font-size: 13px;
        }
        .shortcut-capture:hover { border-color: var(--accent); }
        .shortcut-capture.active {
            border-color: var(--accent);
            background: oklch(95% 0.02 250);
            color: var(--accent);
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }
        .btn-ghost {
            background: none;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--fg);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--muted);
            font-size: 14px;
        }
    </style>

  <link rel="stylesheet" crossorigin href="/assets/shared-D-ql5C5R.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"></path><path d="M6 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"></path></svg>
            <span>Highkey</span>
        </div>
        <nav>
            <a href="#" class="nav-item active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Shortcuts
            </a>
            <a href="#" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>

            <a href="#" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                Settings
            </a>
        </nav>
    </div>

    <div class="main">
        <div class="top-bar">
            <h2>All Shortcuts</h2>
            <div style="display: flex; gap: 16px;">
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-input" placeholder="Search by name or selector...">
                </div>
            </div>
        </div>

        <div class="content">
            <div id="dashboard-content">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Target Selector</th>
                                <th>Shortcut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="shortcut-table-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div style="margin-top: 24px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px;">
                <div id="shortcut-stats">Showing 0 shortcuts</div>
                <div style="display: flex; gap: 12px;">
                    <button id="export-btn" class="btn-ghost">Export JSON</button>
                    <button id="import-btn" class="btn-ghost">Import...</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">Edit Shortcut</div>
            <div class="form-group">
                <label>Label</label>
                <input type="text" id="modal-label" class="form-input" placeholder="e.g. Click Search Bar">
            </div>
            <div class="form-group">
                <label>CSS Selector</label>
                <input type="text" id="modal-selector" class="form-input mono">
            </div>
            <div class="form-group">
                <label>Shortcut Key</label>
                <div id="modal-capture" class="shortcut-capture">Click to record</div>
            </div>
            <div class="modal-footer">
                <button id="modal-cancel" class="btn-ghost">Cancel</button>
                <button id="modal-save" class="btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

</body>
</html>
